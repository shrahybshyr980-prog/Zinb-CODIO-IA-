<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إشارتي – نموذج التطبيق</title>
<style>
:root{--bg:#f3f1fd;--card:#fff;--ink:#1d1a3f;--mute:#6b678f;--pri:#3a2bc4;--blue:#1b6df2;--green:#12a150;--orange:#f08a00;--purple:#6a3fd6;--soft:#e4e0fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#201d44;--ink:#f1efff;--mute:#a9a5d6;--soft:#2e2a63}}
:root[data-theme="dark"]{--bg:#14122b;--card:#201d44;--ink:#f1efff;--mute:#a9a5d6;--soft:#2e2a63}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
header button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:16px}
nav{display:flex;background:var(--pri);padding:6px 0}
nav button{flex:1;background:none;border:0;color:#cfc9ff;font:inherit;font-size:12px;padding:6px;cursor:pointer}
nav button.on{color:#fff;font-weight:700}
nav span{display:block;font-size:20px}
.logo{text-align:center;padding:10px 0 14px}
.logo .big{font-size:56px}
.logo h1{margin:0;font-size:34px}
.logo p{margin:4px 0 0;color:var(--mute)}
.btn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;padding:16px;margin-bottom:12px;color:#fff;font:inherit;font-size:17px;font-weight:700;text-align:right;cursor:pointer}
.btn small{display:block;font-weight:400;font-size:13px;opacity:.9}
.btn i{font-style:normal;font-size:28px}
.b1{background:var(--blue)}.b2{background:var(--green)}.b3{background:var(--purple)}.b4{background:var(--orange)}
.stage{background:var(--soft);border-radius:18px;aspect-ratio:2/1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:96px;position:relative;overflow:hidden}
.stage.cam{border:3px dashed var(--green)}
.stage small{font-size:14px;color:var(--mute);position:absolute;top:10px;font-weight:600}
.res{background:#d9f7e3;color:#0b5a2b;border:2px solid #2bb865;border-radius:16px;padding:12px 16px;margin-top:14px;text-align:center}
.res b{display:block;font-size:30px}
.row{display:flex;gap:10px;margin-top:12px}
.sm{flex:1;border:0;border-radius:14px;padding:12px;background:var(--soft);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.pri{background:var(--pri);color:#fff}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:14px;border:1px solid var(--soft);background:var(--card);color:var(--ink);margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:20px;padding:10px;background:var(--soft);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--purple);color:#fff}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:18px;font-weight:700;cursor:pointer;border:0;width:100%;font-family:inherit;color:var(--ink);text-align:right}
.item .th{width:52px;height:44px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px}
.tip{background:var(--soft);border-radius:14px;padding:12px;margin-top:12px;font-size:14px;color:var(--mute)}
.set{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.sw{width:46px;height:26px;border-radius:13px;background:#bbb;position:relative;border:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}.sw.on::after{right:23px}
.stage img{width:100%;height:100%;object-fit:contain}.th img{width:100%;height:100%;object-fit:cover;border-radius:10px}.th{overflow:hidden}.shake{animation:s .6s ease-in-out infinite}
@keyframes s{50%{transform:rotate(-12deg) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.note{text-align:center;color:var(--mute);font-size:12px;margin-top:14px}
</style>
</head>
<body>
<div id="app">
  <header><button id="back" aria-label="رجوع" hidden>→</button><span id="title" style="flex:1">إشارتي</span></header>
  <main id="main"></main>
  <nav>
    <button data-go="home"><span>🏠</span>الرئيسية</button>
    <button data-go="learn"><span>🎓</span>تعلّم</button>
    <button data-go="chat"><span>💬</span>الدردشة</button>
    <button data-go="dict"><span>📖</span>القاموس</button>
    <button data-go="settings"><span>⚙️</span>الإعدادات</button>
  </nav>
</div>

const I={
chat(){const R=$("#reg");if(R){R.onclick=()=>{const u=$("#un").value.trim();if(u.length<3||$("#pw").value.length<4){$("#lerr").textContent="الاسم 3 أحرف على الأقل وكلمة السر 4 أحرف";return}S.u=u;go("chat")}}else{$("#out").onclick=()=>{S.u=null;go("chat")}}},
room(){const send=m=>{(S.msgs[S.r]=S.msgs[S.r]||[]).push({me:1,...m});reply(m);go("room")};
 const nr=s=>s.replace(/^ال/,"");const fm=t=>t?W.find(w=>w[0]===t)||W.find(w=>nr(w[0]).startsWith(nr(t)))||W.find(w=>w[0].includes(t)):null;
 $("#mt").oninput=e=>{const t=e.target.value.trim(),m=fm(t);$("#pv").innerHTML=!t?"":m?`<div class="res" style="background:var(--card);color:var(--ink);border-color:var(--soft);margin:0 0 10px"><div class="stage" style="aspect-ratio:2/1">${pic(m[1])}</div><b>${m[0]}</b>ستُرسل الإشارة مع الرسالة</div>`:'<div class="res" style="background:#fde7e7;color:#b3261e;border-color:#d93025;margin:0 0 10px">الإشارة غير متوفرة حاليًا</div>'};
 $("#snd").onclick=()=>{const t=$("#mt").value.trim();if(!t)return;const m=fm(t);send(m&&m[0]===t?{t}:m?{s:m[1]}:{t})};
 $("#mt").onkeydown=e=>{if(e.key==="Enter")$("#snd").click()};
 $("#sg").onclick=()=>{$("#pk").innerHTML='<input type="text" id="pq" placeholder="ابحث عن إشارة..." aria-label="بحث" style="margin-top:12px"><div id="pl"></div>';const dr=q=>{$("#pl").innerHTML=W.filter(w=>w[0].includes(q)).slice(0,6).map(w=>`<button class="item" data-sg="${w[1]}"><span class="th">${pic(w[1])}</span><span style="flex:1">${w[0]}</span></button>`).join("")};dr("");$("#pq").oninput=e=>dr(e.target.value);$("#pl").onclick=e=>{const b=e.target.closest("[data-sg]");if(b)send({s:+b.dataset.sg})}}},
home(){const q=$("#hq"),o=$("#hr");q.oninput=()=>{const t=q.value.trim();if(!t){o.innerHTML="";return}const m=W.filter(w=>w[0].includes(t));o.innerHTML=m.length?m.slice(0,3).map(w=>`<div class="res" style="background:var(--card);color:var(--ink);border-color:var(--soft);margin:0 0 12px"><div class="stage" style="aspect-ratio:2/1">${pic(w[1])}</div><b>${w[0]}</b></div>`).join(""):'<div class="res" style="background:#fde7e7;color:#b3261e;border-color:#d93025;margin:0 0 12px">الإشارة غير متوفرة حاليًا</div>'}},
cam(){let n=0;const k=[0,1,4,2];
 $("#rec").onclick=()=>{const i=k[n%4];$("#ce").innerHTML=pic(i);$("#cr").innerHTML="النتيجة: ✔<b>"+W[i][0]+"</b>";n++};
 $("#rst").onclick=()=>{$("#ce").innerHTML=pic(0);$("#cr").innerHTML="النتيجة:<b>—</b>"}},
vid(){const play=()=>{clearInterval(tmr);let r=$("#tx").value.trim();const ws=[];
  while(r){r=r.trim();const m=W.filter(w=>r.startsWith(w[0])).sort((a,b)=>b[0].length-a[0].length)[0];if(m){ws.push(m);r=r.slice(m[0].length)}else{const sp=r.indexOf(" ");ws.push([sp<0?r:r.slice(0,sp),-1]);r=sp<0?"":r.slice(sp)}}
  let k=0;const step=()=>{const m=ws[k];$("#ve").innerHTML=m[1]>=0?pic(m[1]):'<span style="color:#d93025;font-size:18px;padding:12px;text-align:center">الإشارة غير متوفرة حاليًا<br>«'+m[0]+'»</span>';k++;if(k>=ws.length)clearInterval(tmr)};
  if(ws.length){step();tmr=setInterval(step,1300)}};
 $("#show").onclick=play;$("#tx").onkeydown=e=>{if(e.key==="Enter")play()};$("#rep").onclick=play;$("#dl").onclick=()=>alert("في التطبيق الحقيقي: يُحفظ الفيديو على الجهاز")},
dict(){const draw=q=>{$("#ls").innerHTML=W.filter(w=>w[0].includes(q)).map(w=>`<button class="item" data-d="${w[1]}"><span class="th">${pic(w[1])}</span><span style="flex:1">${w[0]}</span>›</button>`).join("")||'<p class="note">لا توجد نتائج</p>'};
 draw("");$("#q").oninput=e=>draw(e.target.value)}
};
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");if(g)return go(g.dataset.go);
 const rr=e.target.closest("[data-r]");if(rr){S.r=+rr.dataset.r;return go("room")}
 const d=e.target.closest("[data-d]");if(d){S.d=+d.dataset.d;return go("detail")}
 const t=e.target.closest("[data-t]");if(t){S.tab=t.dataset.t;S.i=0;return go("learn")}
 if(e.target.id==="nx"){S.i++;return go("learn")}
 if(e.target.id==="pv"){S.i=Math.max(0,S.i-1);return go("learn")}
 const s=e.target.closest("[data-sw]");if(s){const k=s.dataset.sw;S.sw[k]=!S.sw[k];
  if(k==="dark")document.documentElement.dataset.theme=S.sw.dark?"dark":"light";return go("settings")}
 if(e.target.closest("#back"))go(S.v==="detail"?"dict":S.v==="room"?"chat":"home")});
go("home");
</script>
</body>
</html>
